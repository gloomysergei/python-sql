[project]
authors = [
    {name = "Sergey Jkovlev", email = "almazopal@gmail.com"},
]
requires-python = "<4.0,>=3.12"
name = "python-example-sql"
version = "0.1.0"
description = "Example application"
readme = "README.md"
dependencies = [
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.7.1",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]

[project.scripts]
hexlet-python-package = "hexlet_python_package.scripts.main:main"

[tool.coverage.report]
# Порог покрытия: ниже него `make test-coverage` падает,
# и сборка в CI краснеет вместе с ним
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexlet_python_package"]
